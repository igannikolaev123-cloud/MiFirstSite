<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер, popup</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="timer-card">
        <p class="small-title">ТЕКУЩЕЕ ВРЕМЯ</p>
        <div id="currentTime" class="digital-clock">00:00:00</div>

        <button id="setTimerButton" class="main-button" type="button">
            Установить таймер
        </button>
        <div id="countdown" class="countdown-button" aria-live="polite" hidden>00:00:00</div>
    </main>

    <div id="timerModal" class="modal" aria-hidden="true">
        <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button id="closeModalButton" class="close-button" type="button" aria-label="Закрыть">×</button>
            <h1 id="modalTitle">УСТАНОВИТЬ ТАЙМЕР</h1>
            <label for="secondsInput">Количество секунд</label>
            <input
                id="secondsInput"
                type="text"
                inputmode="numeric"
                maxlength="4"
                autocomplete="off"
                placeholder="60"
                aria-describedby="inputHint"
            >
            <p id="inputHint" class="input-hint">Введите число от 0 до 9999</p>
            <button id="startButton" class="start-button" type="button">СТАРТ</button>
        </div>
    </div>
</body>
</html>
